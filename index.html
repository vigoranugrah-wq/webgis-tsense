```html
<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>T-Sense WebGIS Realtime</title>


    <!-- ============================= -->
    <!-- LEAFLET CSS -->
    <!-- ============================= -->

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>


    <!-- ============================= -->
    <!-- STYLE -->
    <!-- ============================= -->

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }


        /* HEADER */

        header {
            background: #0b5ed7;
            color: white;
            padding: 20px;
            text-align: center;
        }


        header h1 {
            margin: 0;
        }


        header p {
            margin-bottom: 0;
        }


        /* CONTAINER */

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 20px auto;
        }


        /* CARD */

        .cards {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(220px, 1fr)
                );

            gap: 15px;

            margin-bottom: 20px;
        }


        .card {

            background: white;

            padding: 20px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px
                rgba(0,0,0,0.1);

        }


        .judul {

            font-size: 14px;

            color: #666;

        }


        .nilai {

            font-size: 30px;

            font-weight: bold;

            margin-top: 10px;

        }


        /* MAP */

        #map {

            height: 500px;

            width: 100%;

            border-radius: 10px;

            margin-bottom: 20px;

        }


        /* GRAFIK */

        .grafik {

            background: white;

            padding: 15px;

            border-radius: 10px;

        }


        iframe {

            width: 100%;

            height: 450px;

            border: none;

        }


        /* STATUS */

        .online {

            color: green;

        }


        .offline {

            color: red;

        }

    </style>

</head>


<body>


<!-- ============================= -->
<!-- HEADER -->
<!-- ============================= -->

<header>

    <h1>🌊 T-Sense WebGIS</h1>

    <p>
        Monitoring Pasang Surut Berbasis
        Internet of Things
    </p>

</header>



<div class="container">


    <!-- ============================= -->
    <!-- DATA REALTIME -->
    <!-- ============================= -->

    <div class="cards">


        <!-- JARAK -->

        <div class="card">

            <div class="judul">
                Jarak Sensor
            </div>

            <div
                class="nilai"
                id="jarak">

                -

            </div>

            <div>
                cm
            </div>

        </div>



        <!-- WAKTU -->

        <div class="card">

            <div class="judul">
                Waktu Data
            </div>

            <div
                class="nilai"
                id="waktu">

                -

            </div>

        </div>



        <!-- STATUS -->

        <div class="card">

            <div class="judul">
                Status T-Sense
            </div>

            <div
                class="nilai"
                id="status">

                Menghubungkan...

            </div>

        </div>


    </div>



    <!-- ============================= -->
    <!-- MAP -->
    <!-- ============================= -->

    <div id="map"></div>



    <!-- ============================= -->
    <!-- GRAFIK -->
    <!-- ============================= -->

    <div class="grafik">

        <h2>
            Grafik Data T-Sense
        </h2>


        <iframe
            src="https://thingspeak.com/channels/3097834/charts/6?bgcolor=%23ffffff&color=%23007bff&dynamic=true&results=30">
        </iframe>

    </div>


</div>



<!-- ============================= -->
<!-- LEAFLET JS -->
<!-- ============================= -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>



<script>


// ======================================
// 1. MEMBUAT PETA
// ======================================

var map = L.map('map')
    .setView(
        [-2.38, 104.90],
        10
    );



// ======================================
// 2. OPENSTREETMAP
// ======================================

var osm = L.tileLayer(

    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',

    {

        attribution:
            '&copy; OpenStreetMap contributors'

    }

).addTo(map);



// ======================================
// 3. SATELLITE
// ======================================

var satellite = L.tileLayer(

    'https://server.arcgisonline.com/' +
    'ArcGIS/rest/services/' +
    'World_Imagery/MapServer/tile/{z}/{y}/{x}',

    {

        attribution:
            'Tiles &copy; Esri'

    }

);



// ======================================
// 4. MARKER T-SENSE
// ======================================

var tsense = L.marker(

    [-2.38, 104.90]

).addTo(map);



// Popup awal

tsense.bindPopup(

    "<b>🌊 T-Sense</b><br>" +

    "Stasiun Monitoring<br>" +

    "Muara Sungsang<br><br>" +

    "Data: <span id='popupData'>" +
    "-" +
    "</span> cm"

);



// ======================================
// 5. LAYER CONTROL
// ======================================

var baseMaps = {

    "OpenStreetMap": osm,

    "Satellite": satellite

};


L.control.layers(

    baseMaps

).addTo(map);



// ======================================
// 6. THINGSPEAK
// ======================================

const channelID = "3097834";



// ======================================
// 7. MENGAMBIL DATA TERBARU
// ======================================

function ambilData() {


    const url =

        "https://api.thingspeak.com/" +

        "channels/" +

        channelID +

        "/feeds.json?results=1";



    fetch(url)


        .then(

            response =>
                response.json()

        )


        .then(

            data => {


                // ======================
                // CEK DATA
                // ======================

                if (
                    !data.feeds ||
                    data.feeds.length === 0
                ) {

                    document.getElementById(
                        "status"
                    ).innerText =
                        "NO DATA";

                    return;

                }



                // ======================
                // DATA TERBARU
                // ======================

                var terbaru =
                    data.feeds[0];



                // ======================
                // FIELD 6
                // ======================

                var nilai =
                    terbaru.field6;



                // ======================
                // WAKTU
                // ======================

                var waktu =
                    terbaru.created_at;



                // ======================
                // TAMPILKAN JARAK
                // ======================

                if (nilai !== null) {


                    var angka =
                        parseFloat(nilai);


                    document.getElementById(
                        "jarak"
                    ).innerText =
                        angka.toFixed(2);



                    // ==================
                    // UPDATE POPUP
                    // ==================

                    document.getElementById(
                        "popupData"
                    ).innerText =
                        angka.toFixed(2);

                }



                // ======================
                // TAMPILKAN WAKTU
                // ======================

                var waktuIndonesia =
                    new Date(waktu)
                    .toLocaleString(
                        "id-ID",
                        {
                            timeZone:
                                "Asia/Jakarta"
                        }
                    );


                document.getElementById(
                    "waktu"
                ).innerText =
                    waktuIndonesia;



                // ======================
                // STATUS ONLINE
                // ======================

                document.getElementById(
                    "status"
                ).innerText =
                    "ONLINE";


                document.getElementById(
                    "status"
                ).className =
                    "nilai online";



                console.log(
                    "Data T-Sense:",
                    terbaru
                );

            }

        )


        .catch(

            error => {


                console.error(
                    error
                );


                document.getElementById(
                    "status"
                ).innerText =
                    "OFFLINE";


                document.getElementById(
                    "status"
                ).className =
                    "nilai offline";

            }

        );

}



// ======================================
// 8. JALANKAN PERTAMA KALI
// ======================================

ambilData();



// ======================================
// 9. UPDATE OTOMATIS
// ======================================

// Setiap 15 detik

setInterval(

    ambilData,

    15000

);


</script>


</body>

</html>
```
